spring.application.name=walletly

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/walletlydb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.path=/h2-console
spring.h2.console.enabled=true
spring.jpa.show-sql=true

# Hibernate Envers Configuration
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
spring.jpa.properties.org.hibernate.envers.default_schema=auditoria
spring.jpa.properties.org.hibernate.envers.revision_sequence_name=auditoria.revinfo_seq

spring.flyway.enabled=true
spring.flyway.locations=classpath:db_migrations
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/walletlydb}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME:postgres}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.properties.hibernate.integration.envers.enabled=false

jwt.secret=MTIxNzI0MzIwMjYxZmU0ODMzZGQyYzIyYWM0ZTFkOGU5YmQxN2Y5NWM4YmJlMDA1NjY0MWY2NGJlZjkxYjMxYg==
jwt.expiration=3600000

server.servlet.context-path=/api
server.port=8080

spring.security.user.name=admin
spring.security.user.password=admin

# Limite de tamanho de arquivo para Multipart (Upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logs de Debug de Segurança
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG